name: EAS Preview Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'

concurrency:
  group: eas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview (iOS + Android)
        run: eas build --profile preview --platform all --non-interactive
        working-directory: apps/mobile

      - name: Post build link to PR
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha.slice(0, 7);
            const body = [
              '## 📱 EAS Preview Build',
              '',
              'Build complete. Download links are on the [Expo Dashboard](https://expo.dev).',
              '',
              `_Commit: ${sha} · PR #${context.issue.number}_`,
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
